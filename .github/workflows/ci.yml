name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan (working tree)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # History purge — Owner step; CI guards the current tree after untrack.
          args: --no-git --config .gitleaks.toml

  build:
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip & poetry (если используете poetry)
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: |
          poetry install || pip install -r requirements.txt

      - name: Verify bot_aiogram dependency closure
        run: python -c "import bot_aiogram"

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff core/ bot.py services/ utils/ telegram_bot/

      - name: Run tests with pytest
        run: |
          pip install pytest pytest-cov pytest-asyncio
          pytest \
            --cov=bot_aiogram \
            --cov=telegram_bot \
            --cov=services \
            --cov=storage \
            --cov-report=term-missing \
            --cov-fail-under=55
