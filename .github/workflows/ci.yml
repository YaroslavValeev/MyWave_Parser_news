name: CI

on:
  push:
    branches: [ main, dev, feat/p0-security-cleanup, feat/blog-editorial-media-pipeline ]
  pull_request:
    branches: [ main, dev, feat/p0-security-cleanup, feat/blog-editorial-media-pipeline ]

jobs:
  secret-scan-tree:
    name: Secret scan (current tree)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan current working tree only
        run: |
          gitleaks detect \
            --no-git \
            --source . \
            --config .gitleaks.toml \
            --verbose \
            --redact \
            --exit-code 1

  secret-scan-history:
    name: Secret scan (git history report)
    runs-on: ubuntu-latest
    # Full-history findings expected until HISTORY_PURGE_PLAN Owner GO.
    continue-on-error: true
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full git history (report)
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --verbose \
            --redact \
            --report-format json \
            --report-path gitleaks-history-report.json \
            --exit-code 0 || true
          # exit-code 0 always: report-only until history purge; tree scan is the hard gate

      - name: Upload history scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history-report
          path: gitleaks-history-report.json
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: secret-scan-tree

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip & poetry (если используете poetry)
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: |
          poetry install || pip install -r requirements.txt

      - name: Verify bot_aiogram dependency closure
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          skip_parts = {".venv", "venv", ".venv311", ".git", "migrations", "site-packages", "_aiosqlite_local_backup"}
          bad = []
          for path in Path(".").rglob("*.py"):
              if any(part in skip_parts or part.startswith(".venv") for part in path.parts):
                  continue
              src = path.read_text(encoding="utf-8", errors="replace")
              if src.count("from __future__ import annotations") > 1:
                  bad.append(str(path))
              try:
                  ast.parse(src)
              except SyntaxError as exc:
                  raise SystemExit(f"syntax_error:{path}:{exc}") from exc
          if bad:
              raise SystemExit("duplicate_future_imports:" + ",".join(bad))
          print("ast_ok")
          PY
          python -c "import bot_aiogram; print('import_ok')"

      - name: Lint with ruff (critical rules)
        run: |
          pip install ruff
          # F401/E402 backlog in legacy modules — out of P0 gate; catch undefined names / syntax-class issues
          ruff check bot.py services/ utils/ telegram_bot/ core/ --select E9,F63,F7,F82

      - name: Run P0 gate pytest suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install pytest pytest-asyncio
          pytest -q --tb=short \
            tests/test_editorial_contract.py \
            tests/test_video_providers.py \
            tests/test_safe_http.py \
            tests/test_media_contract.py \
            tests/test_media_upload.py \
            tests/test_card_preview_text.py \
            tests/test_raw_feed_publish_contract.py \
            tests/test_owner_review_telegram.py \
            tests/test_telegram_editorial.py \
            tests/test_web_editorial.py \
            tests/test_client_copy.py \
            tests/test_collect_report.py \
            tests/test_scheduler_lock.py \
            tests/test_publication_service.py
