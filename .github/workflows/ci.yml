name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 bandit safety

      - name: Lint code
        run: flake8 .

      - name: Security checks (bandit)
        run: bandit -r .

      - name: Security checks (safety)
        run: safety check

      - name: Check outdated dependencies  # Regularly check for library updates to mitigate vulnerabilities
        run: pip list --outdated

      - name: Run tests
        run: pytest --maxfail=1 --disable-warnings -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: "${{ secrets.DOCKERHUB_USERNAME }}/mywave_parser_wakenews:latest"
