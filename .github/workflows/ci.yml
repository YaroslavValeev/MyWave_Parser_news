name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  secret-scan-tree:
    name: Secret scan (current tree)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gitleaks current working tree
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Guard committed + checked-out files (not full history).
          args: --no-git --config .gitleaks.toml --verbose

  secret-scan-history:
    name: Secret scan (git history report)
    runs-on: ubuntu-latest
    # History rewrite is Owner GO. Until HISTORY_PURGE_PLAN is executed,
    # this job may fail; it must NOT be the only scan (see secret-scan-tree).
    continue-on-error: true
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks full git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --config .gitleaks.toml --verbose --report-path gitleaks-history-report.json

      - name: Upload history scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history-report
          path: gitleaks-history-report.json
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: secret-scan-tree

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip & poetry (если используете poetry)
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: |
          poetry install || pip install -r requirements.txt

      - name: Verify bot_aiogram dependency closure
        run: python -c "import bot_aiogram"

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff core/ bot.py services/ utils/ telegram_bot/

      - name: Run tests with pytest
        run: |
          pip install pytest pytest-cov pytest-asyncio
          pytest \
            --cov=bot_aiogram \
            --cov=telegram_bot \
            --cov=services \
            --cov=storage \
            --cov-report=term-missing \
            --cov-fail-under=55
